# XcodeGen spec. Generate with `xcodegen generate`; never hand-edit Nimbus.xcodeproj (it is gitignored).
name: Nimbus
options:
  bundleIdPrefix: com.sami5436
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  NimbusKit:
    path: NimbusKit
targets:
  Nimbus:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
    dependencies:
      - package: NimbusKit
        product: NimbusKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Nimbus
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Nimbus uses your location to show the weather where you are.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sami5436.nimbus
        TARGETED_DEVICE_FAMILY: "1"
  NimbusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
    dependencies:
      - target: Nimbus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sami5436.nimbus.tests
        GENERATE_INFOPLIST_FILE: YES
  NimbusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
    dependencies:
      - target: Nimbus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sami5436.nimbus.uitests
        TEST_TARGET_NAME: Nimbus
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Nimbus:
    build:
      targets:
        Nimbus: all
    test:
      targets:
        - NimbusTests
  NimbusDemo:
    build:
      targets:
        Nimbus: all
    test:
      targets:
        - NimbusUITests
